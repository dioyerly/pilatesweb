<svg viewBox="0 0 3488 1216" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Georgia', serif; font-size: 280px; font-weight: normal; fill: #5a6f5e; letter-spacing: 8px; }
      .circle { fill: #5a6f5e; }
      .icon { fill: #d4c88e; stroke: none; }
      .icon-line { fill: none; stroke: #d4c88e; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Título -->
  <text x="1744" y="320" class="title" text-anchor="middle">ARA TRAINER</text>

  <!-- ICONO 1: PILATES (brazada/leg pull) -->
  <circle cx="436" cy="840" r="280" class="circle"/>
  <g transform="translate(436, 840)">
    <!-- Cabeza -->
    <circle cx="0" cy="-120" r="50" class="icon"/>
    <!-- Brazo sosteniendo en posición de push -->
    <path d="M -40 -40 L -180 100" class="icon-line" stroke-width="30"/>
    <!-- Otro brazo -->
    <path d="M 40 -40 L 180 100" class="icon-line" stroke-width="30"/>
    <!-- Pierna extendida -->
    <path d="M 0 80 L 0 280" class="icon-line" stroke-width="30"/>
    <!-- Otra pierna -->
    <path d="M 0 80 L -150 200" class="icon-line" stroke-width="30"/>
    <!-- Línea del suelo -->
    <line x1="-220" y1="280" x2="220" y2="280" class="icon-line" stroke-width="25"/>
  </g>

  <!-- ICONO 2: MEDITACIÓN (loto) -->
  <circle cx="1308" cy="840" r="280" class="circle"/>
  <g transform="translate(1308, 840)">
    <!-- Cabeza -->
    <circle cx="0" cy="-140" r="55" class="icon"/>
    <!-- Cuerpo en posición zen -->
    <ellipse cx="0" cy="40" rx="80" ry="100" class="icon"/>
    <!-- Pierna izquierda en loto -->
    <path d="M -70 110 Q -130 150 -140 220" class="icon-line" stroke-width="28"/>
    <!-- Pierna derecha en loto -->
    <path d="M 70 110 Q 130 150 140 220" class="icon-line" stroke-width="28"/>
    <!-- Mano izquierda -->
    <circle cx="-70" cy="60" r="40" class="icon"/>
    <!-- Mano derecha -->
    <circle cx="70" cy="60" r="40" class="icon"/>
  </g>

  <!-- ICONO 3: NUTRICIÓN (botella, reloj, manzana) -->
  <circle cx="2180" cy="840" r="280" class="circle"/>
  <g transform="translate(2180, 840)">
    <!-- Botella -->
    <rect x="-90" y="-80" width="80" height="180" rx="15" fill="none" stroke="#d4c88e" stroke-width="20"/>
    <rect x="-60" y="-130" width="50" height="50" rx="8" class="icon"/>
    <!-- Agua dentro botella -->
    <rect x="-80" y="40" width="60" height="60" rx="10" class="icon" opacity="0.7"/>
    <!-- Reloj -->
    <circle cx="120" cy="-40" r="70" fill="none" stroke="#d4c88e" stroke-width="18"/>
    <line x1="120" y1="-40" x2="120" y2="-100" stroke="#d4c88e" stroke-width="14" stroke-linecap="round"/>
    <line x1="120" y1="-40" x2="170" y2="-40" stroke="#d4c88e" stroke-width="14" stroke-linecap="round"/>
    <circle cx="120" cy="-40" r="12" class="icon"/>
    <!-- Manzana -->
    <circle cx="140" cy="140" r="70" fill="none" stroke="#d4c88e" stroke-width="18"/>
    <path d="M 140 60 L 160 40 L 150 30" fill="none" stroke="#d4c88e" stroke-width="16" stroke-linecap="round"/>
    <circle cx="155" cy="35" r="10" class="icon"/>
  </g>

  <!-- ICONO 4: FLEXIBILIDAD (estiramiento con pierna levantada) -->
  <circle cx="3052" cy="840" r="280" class="circle"/>
  <g transform="translate(3052, 840)">
    <!-- Cabeza -->
    <circle cx="0" cy="-130" r="50" class="icon"/>
    <!-- Cuerpo inclinado -->
    <path d="M 0 -70 L 30 100" class="icon-line" stroke-width="35"/>
    <!-- Brazo extendido -->
    <path d="M 10 -50 L 150 150" class="icon-line" stroke-width="28"/>
    <!-- Pierna levantada -->
    <path d="M 20 100 L 200 -80" class="icon-line" stroke-width="30"/>
    <!-- Pierna de apoyo -->
    <path d="M 30 100 L 50 250" class="icon-line" stroke-width="30"/>
    <!-- Línea del suelo -->
    <line x1="-180" y1="280" x2="280" y2="280" class="icon-line" stroke-width="25"/>
  </g>

  <!-- ICONO 5: EQUILIBRIO (bola de fitness con figura) -->
  <circle cx="1744" cy="840" r="280" class="circle"/>
  <g transform="translate(1744, 840)">
    <!-- Bola de equilibrio (grande) -->
    <circle cx="0" cy="120" r="140" fill="none" stroke="#d4c88e" stroke-width="22"/>
    <!-- Línea horizontal en bola (horizonte) -->
    <ellipse cx="0" cy="120" rx="135" ry="45" fill="none" stroke="#d4c88e" stroke-width="16" opacity="0.6"/>
    <!-- Cabeza -->
    <circle cx="0" cy="-100" r="50" class="icon"/>
    <!-- Cuerpo sentado -->
    <path d="M 0 -40 L 0 60" class="icon-line" stroke-width="35"/>
    <!-- Brazo izquierdo extendido -->
    <path d="M -30 -20 L -150 -100" class="icon-line" stroke-width="28"/>
    <!-- Brazo derecho extendido -->
    <path d="M 30 -20 L 150 -100" class="icon-line" stroke-width="28"/>
    <!-- Pierna izquierda -->
    <path d="M -20 60 L -80 200" class="icon-line" stroke-width="28"/>
    <!-- Pierna derecha -->
    <path d="M 20 60 L 80 200" class="icon-line" stroke-width="28"/>
  </g>
</svg>